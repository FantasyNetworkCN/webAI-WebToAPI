[program:webtoapi]
command=/opt/java/openjdk/bin/java -cp /app/target/classes:/app/target/dependency/* Main
directory=/app
user=webtoapi
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY=":1"
