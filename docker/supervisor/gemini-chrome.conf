[program:gemini-chrome]
command=/usr/local/bin/start-chromium.sh --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --no-first-run --no-default-browser-check --remote-debugging-address=127.0.0.1 --remote-allow-origins=* --user-data-dir=/app/data/gemini-profile --start-maximized https://gemini.google.com/app
directory=/app/data
user=webtoapi
priority=12
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY=":1"
