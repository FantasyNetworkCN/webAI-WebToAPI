services:
  # One container: virtual desktop + regular Chromium + Java API.
  webtoapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: webai-webtoapi:latest
    restart: unless-stopped
    shm_size: 2gb
    # Share the host network so the container can reach a proxy bound to
    # the host's 127.0.0.1:7890. Service ports are therefore direct host ports.
    network_mode: host
    environment:
      VNC_PASSWD: "${VNC_PASSWD:-change-me}"
      OPENAI_PORT: "60000"
      PROXY_ENABLED: "${PROXY_ENABLED:-true}"
      PROXY_TYPE: "${PROXY_TYPE:-http}"
      PROXY_HOST: "${PROXY_HOST:-127.0.0.1}"
      PROXY_PORT: "${PROXY_PORT:-7890}"
      GEMINI_COOKIE_ENABLED: "true"
      GEMINI_COOKIE_LAUNCH_CHROME: "false"
      GEMINI_COOKIE_DEBUG_HOST: "127.0.0.1"
      # Host networking makes CDP ports global on the host; keep this project
      # separate from other browser containers that commonly use 9222.
      GEMINI_COOKIE_DEBUG_PORT: "19222"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19222/json >/dev/null && curl -fsS http://127.0.0.1:60000/v1/models >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - ./config.yml:/app/config.yml:ro
      - webtoapi-data:/app/data
      - webtoapi-logs:/app/logs

volumes:
  webtoapi-data:
  webtoapi-logs:
