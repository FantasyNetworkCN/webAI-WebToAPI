# 代理，国内环境必须配置
proxy:
  enabled: true
  type: http
  host: 127.0.0.1
  port: 7890

# 是否开启openai格式api封装
openai:
  enabled: true
  host: 0.0.0.0
  port: 11434

# ChatGPT 网页端逆向接口。模型会以 chatgpt-web 出现在 /v1/models。
# 完整 conversation curl 请在 Web 页面“ChatGPT Curl”中粘贴保存。
chatgpt:
  model: auto

# Gemini Cookie 与 SNlM0e 自动获取。
# 程序会自动执行：
# google-chrome --remote-debugging-port=9222 --user-data-dir="~/.config/google-chrome-debug" --remote-allow-origins="*" --disable-vulkan
# 然后通过 Chrome DevTools Protocol 从 Gemini 页面读取 Cookie 和 window.WIZ_global_data.SNlM0e，
# 并覆盖 curl 里的静态 -b Cookie 与 form body 里的 at 参数。
gemini_cookie:
  enabled: true
  launch_chrome: true
  chrome_binary: google-chrome
  debug_host: 127.0.0.1
  debug_port: 9222
  user_data_dir: ~/.config/google-chrome-debug
  page_url: https://gemini.google.com/app
  cookie_urls: https://gemini.google.com,https://gemini.google.com/app,https://google.com

# 把完整的 StreamGenerate curl 粘到下一行。
# 不需要按 YAML 缩进；-b Cookie 可以省略，即使保留也会被 gemini_cookie 自动覆盖。
# --data-raw 里的 at 参数也会自动替换为页面当前 SNlM0e。
